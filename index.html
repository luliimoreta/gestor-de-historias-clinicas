<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VitalDoc - Gestión Clínica</title>
    <meta name="theme-color" content="#2C3E50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="ICONO.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="ICONO.jpg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar Pacientes..." id="searchInput">
            </div>
        </header>

        <main id="mainContent">
            <!-- Home View -->
            <section id="homeView" class="view-section active">
                <h2>PACIENTES RECIENTES</h2>
                <div id="patientList">
                    <!-- Patient cards will be injected by script.js -->
                </div>
            </section>

            <!-- Statistics View -->
            <section id="statsView" class="view-section">
                <h2>ESTADÍSTICAS</h2>
                <div class="chart-card">
                    <div class="chart-title">Distribución de Triaje</div>
                    <div class="bar-chart" id="triageChart">
                        <!-- Bars will be injected by script.js -->
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Resumen de Actividad</div>
                    <p style="font-size: 14px; color: var(--text-secondary);">Total de pacientes hoy: <span id="totalToday" style="font-weight: 700; color: var(--navy-blue);">0</span></p>
                </div>
            </section>

            <!-- Agenda View -->
            <section id="agendaView" class="view-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2>AGENDA</h2>
                    <button id="newAppointmentBtn" class="export-pdf-btn" style="width: auto; padding: 0 16px; font-weight: bold; background: var(--medical-blue); color: white; border-radius: 8px;">
                        <i class="fas fa-plus"></i>&nbsp; Nuevo Turno
                    </button>
                </div>
                <div id="appointmentsList">
                    <!-- Appointments will be injected here -->
                </div>
            </section>

            <!-- Ajustes View -->
            <section id="ajustesView" class="view-section">
                <h2>CONFIGURACIÓN DEL MÉDICO</h2>
                <div class="chart-card">
                    <form id="settingsForm">
                        <div class="form-group">
                            <label for="docName">Nombre del Médico</label>
                            <input type="text" id="docName" placeholder="Ej: Dr. Juan Pérez" required>
                        </div>
                        <div class="form-group">
                            <label for="docSpec">Especialidad</label>
                            <input type="text" id="docSpec" placeholder="Ej: Cardiología" required>
                        </div>
                        <div class="form-group">
                            <label for="docClinic">Nombre de la Clínica / Consultorio</label>
                            <input type="text" id="docClinic" placeholder="Ej: Centro Médico Salud" required>
                        </div>
                        <button type="submit" class="submit-btn" id="saveSettingsBtn">GUARDAR CONFIGURACIÓN</button>
                    </form>
                </div>
            </section>
        </main>

        <div class="fab" id="newPatientBtn">
            <i class="fas fa-plus"></i>
            <span>NUEVO PACIENTE</span>
        </div>

        <nav>
            <a href="#" class="nav-item active" id="navHome">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="#" class="nav-item" id="navAgenda">
                <i class="fas fa-calendar-alt"></i>
                <span>Agenda</span>
            </a>
            <a href="#" class="nav-item" id="navStats">
                <i class="fas fa-chart-line"></i>
                <span>Estadísticas</span>
            </a>
            <a href="#" class="nav-item" id="navAjustes">
                <i class="fas fa-cog"></i>
                <span>Ajustes</span>
            </a>
        </nav>

        <!-- New Patient Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">Nuevo Paciente</div>
                    <div class="close-btn" id="closeModal">&times;</div>
                </div>
                <form id="newPatientForm">
                    <div class="form-group">
                        <label for="pName">Nombre Completo</label>
                        <input type="text" id="pName" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label for="pAge">Edad</label>
                        <input type="number" id="pAge" placeholder="Ej: 30" required>
                    </div>
                    <div class="form-group">
                        <label for="pTriage">Estado de Triaje</label>
                        <select id="pTriage" required>
                            <option value="standard">🟢 Estándar</option>
                            <option value="urgent">🟡 Urgente</option>
                            <option value="emergency">🔴 Emergencia</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Firma del Médico</label>
                        <div style="border: 1px solid #E0E0E0; border-radius: 12px; background: #f9f9f9;">
                            <canvas id="signature-pad" width="400" height="150" style="width: 100%; height: 150px; cursor: crosshair;"></canvas>
                        </div>
                        <button type="button" id="clearSignature" style="background: none; border: none; color: var(--medical-blue); font-size: 12px; margin-top: 5px; cursor: pointer;">Limpiar firma</button>
                    </div>
                    <button type="submit" class="submit-btn">GUARDAR PACIENTE</button>
                </form>
            </div>
        </div>

        <!-- New Appointment Modal -->
        <div class="modal-overlay" id="appointmentModal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">Nuevo Turno</div>
                    <div class="close-btn" id="closeAppointmentModal">&times;</div>
                </div>
                <form id="newAppointmentForm">
                    <div class="form-group">
                        <label for="aptPatient">Nombre del Paciente</label>
                        <input type="text" id="aptPatient" placeholder="Ej: María Gómez" required>
                    </div>
                    <div class="form-group">
                        <label for="aptDate">Fecha</label>
                        <input type="date" id="aptDate" required>
                    </div>
                    <div class="form-group">
                        <label for="aptTime">Hora</label>
                        <input type="time" id="aptTime" required>
                    </div>
                    <div class="form-group">
                        <label for="aptReason">Motivo de Consulta</label>
                        <input type="text" id="aptReason" placeholder="Ej: Control general" required>
                    </div>
                    <button type="submit" class="submit-btn">AGENDAR TURNO</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
